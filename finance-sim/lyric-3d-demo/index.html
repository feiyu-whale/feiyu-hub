<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D 歌词 · 唱片机</title>
<!--
  ============================================================
  3D 歌词演示 · 唱片机版
  ------------------------------------------------------------
  干什么：验证「唱片机当歌词载体」这个方向的效果
  技术栈：three.js 0.182（MIT）+ 原生 WebAudio
  素材：零外部资源（模型程序生成，字形靠浏览器 Canvas 现画）
  输入：用户自己的 mp3 + 可选 .lrc（不上传服务器，全在浏览器里跑）
  输出：一台转着的唱片机 + 从喇叭里飞出来的 3D 歌词
  ============================================================
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #080b11; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #c8d6e5;
    -webkit-font-smoothing: antialiased;
  }

  #scene { display: block; width: 100%; height: 100%; }

  /* ---------- 顶栏 ---------- */
  #top {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 14px;
    pointer-events: none;
    z-index: 10;
  }
  #title {
    font-size: 15px; font-weight: 600; letter-spacing: .5px;
    color: #e8f2ff;
    text-shadow: 0 2px 12px rgba(0,0,0,.9);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status {
    font-size: 12px; color: #6d8299;
    transition: color .25s;
  }
  #status.ok { color: #5fd6a0; }
  #status.warn { color: #e8a04c; }

  /* ---------- 拖拽区（常驻，透明，拖进来才亮） ---------- */
  #drop {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0; transition: opacity .22s;
    z-index: 20;
    background: radial-gradient(ellipse at center, rgba(30,90,140,.28), rgba(6,10,16,.9));
    border: 2px dashed rgba(110,190,255,.55);
    border-radius: 0;
  }
  #drop.over { opacity: 1; }
  #drop .hintbox {
    text-align: center; font-size: 17px; color: #bfe4ff;
    text-shadow: 0 2px 16px rgba(0,0,0,.9);
  }
  #drop .hintbox small { display: block; margin-top: 8px; font-size: 12px; color: #7d96ad; }

  /* ---------- 底部控制条 ---------- */
  #bar {
    position: fixed; left: 50%; bottom: 18px;
    transform: translateX(-50%);
    width: min(660px, calc(100vw - 32px));
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    background: rgba(14, 20, 30, .74);
    border: 1px solid rgba(90, 140, 190, .26);
    border-radius: 14px;
    backdrop-filter: blur(16px) saturate(1.3);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    z-index: 15;
    /* 闲置 2.5 秒自动淡出，避免长期压着主体；鼠标靠近就回来 */
    opacity: 1;
    transition: opacity .45s ease, transform .45s ease;
  }
  #bar.idle {
    opacity: .55;
    transform: translateX(-50%) translateY(4px);
  }
  #bar.idle:hover { opacity: 1; transform: translateX(-50%) translateY(0); }

  button {
    flex: none;
    height: 34px; min-width: 34px;
    padding: 0 12px;
    border: 1px solid rgba(100,170,230,.32);
    border-radius: 9px;
    background: rgba(40, 80, 120, .38);
    color: #cfe6ff;
    font-size: 13px;
    cursor: pointer;
    transition: all .18s;
    font-family: inherit;
  }
  button:hover:not(:disabled) { background: rgba(60,120,175,.55); border-color: rgba(130,200,255,.55); }
  button:active:not(:disabled) { transform: scale(.96); }
  button:disabled { opacity: .35; cursor: not-allowed; }

  #btnPlay { font-size: 15px; padding: 0; width: 38px; }
  #btnLoop {
    position: relative;
    padding: 0; width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    opacity: .45;
    transition: opacity .18s, background .18s, border-color .18s, color .18s;
  }
  /* 角标「1」= 单曲循环，和「列表循环」区分开 */
  #loopOne {
    position: absolute; right: 3px; bottom: 2px;
    font-size: 8px; font-weight: 700; line-height: 1;
    color: inherit;
  }
  #btnLoop:hover:not(:disabled) { opacity: .8; }
  /* 开启状态：亮起来 + 描边加亮，一眼能看出在循环 */
  #btnLoop.on {
    opacity: 1;
    color: #eaf6ff;
    background: rgba(80,160,230,.42);
    border-color: rgba(130,200,255,.65);
  }

  .sep { flex: none; width: 1px; height: 22px; background: rgba(100,150,200,.2); }

  /* 歌词整体微调（v1.2.3）：lrc 与音频差半秒很常见，给个 ± 按钮自己对齐 */
  #shiftBox {
    flex: none;
    display: inline-flex; align-items: center; gap: 2px;
    height: 34px; padding: 0 4px;
    border: 1px solid rgba(100,170,230,.26);
    border-radius: 9px;
    background: rgba(40, 80, 120, .22);
  }
  #shiftBox button {
    height: 24px; min-width: 22px; padding: 0 4px;
    font-size: 11px; line-height: 1;
    border: none; background: transparent; color: #8fb6d8;
  }
  #shiftBox button:hover:not(:disabled) { background: rgba(60,120,175,.45); color: #dff0ff; }
  #shiftVal {
    min-width: 42px; text-align: center;
    font-size: 11px; color: #7fa8c8;
    font-variant-numeric: tabular-nums;
    user-select: none;
  }

  /* 视频落点三选一（v1.3.0） */
  #modeBox {
    flex: none;
    display: inline-flex; align-items: center;
    height: 34px; padding: 0 3px;
    border: 1px solid rgba(100,170,230,.26);
    border-radius: 9px;
    background: rgba(40, 80, 120, .22);
  }
  #modeBox .modeBtn {
    height: 26px; min-width: 34px; padding: 0 6px;
    font-size: 11px; line-height: 1;
    border: none; border-radius: 7px;
    background: transparent; color: #8fb6d8;
  }
  #modeBox .modeBtn:hover { background: rgba(60,120,175,.42); color: #dff0ff; }
  #modeBox .modeBtn.on {
    background: rgba(80,160,230,.38);
    color: #eaf6ff;
    box-shadow: inset 0 0 0 1px rgba(130,200,255,.45);
  }

  #prog {
    flex: 1; height: 5px; min-width: 60px;
    background: rgba(255,255,255,.1);
    border-radius: 3px; cursor: pointer; position: relative;
    overflow: hidden;
  }
  #progBar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4a9fe0, #7fe0ff);
    border-radius: 3px;
    transition: width .12s linear;
    box-shadow: 0 0 10px rgba(110,200,255,.6);
  }

  #time {
    flex: none; font-size: 11px; color: #7d94ab;
    font-variant-numeric: tabular-nums;
    min-width: 84px; text-align: right;
  }

  /* 隐藏的文件输入 */
  input[type=file] { display: none; }
  label.btn {
    flex: none; height: 34px; padding: 0 12px;
    display: inline-flex; align-items: center;
    border: 1px solid rgba(100,170,230,.32);
    border-radius: 9px;
    background: rgba(40, 80, 120, .30);
    color: #cfe6ff; font-size: 13px; cursor: pointer;
    transition: all .18s; white-space: nowrap;
  }
  label.btn:hover { background: rgba(60,120,175,.5); }

  /* ---------- 版本号 ---------- */
  #ver {
    position: fixed; right: 10px; bottom: 8px;
    font-size: 10px; color: rgba(140,170,200,.42);
    pointer-events: none; z-index: 12;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 手机适配 ---------- */
  @media (max-width: 560px) {
    #top { padding: 10px 14px; flex-wrap: wrap; gap: 6px; }
    #title { font-size: 13px; width: 100%; }
    #status { font-size: 11px; }
    #bar {
      bottom: 14px; padding: 9px 11px; gap: 8px;
      flex-wrap: wrap;
    }
    label.btn { padding: 0 9px; font-size: 12px; }
    #time { min-width: 74px; font-size: 10px; }
    #prog { order: 10; flex-basis: 100%; margin-top: 4px; }
    #shiftBox { height: 30px; }
    #shiftVal { min-width: 38px; font-size: 10px; }
    #modeBox { height: 30px; }
    #modeBox .modeBtn { min-width: 30px; padding: 0 4px; font-size: 10px; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="top">
  <div id="title">3D 歌词 · 唱片机</div>
  <div id="status">准备中…</div>
</div>

<div id="drop">
  <div class="hintbox">
    松手就加载
    <small>mp3 / mp4 + 可选 .lrc　·　视频会投到地面　·　全在你浏览器里跑，不上传</small>
  </div>
</div>

<div id="bar">
  <button id="btnPlay" disabled>▶</button>
  <!-- 【v1.3.1】单曲循环：听歌时不用守着手动点重播
       用内联 SVG 而不是 emoji —— 服务器/部分安卓机上没有 emoji 字体，会显示成方块 -->
  <button id="btnLoop" title="单曲循环" aria-label="单曲循环">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 2l4 4-4 4"/>
      <path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
      <path d="M7 22l-4-4 4-4"/>
      <path d="M21 13v1a4 4 0 0 1-4 4H3"/>
    </svg>
    <span id="loopOne">1</span>
  </button>

  <div id="prog"><div id="progBar"></div></div>
  <div id="time">0:00 / 0:00</div>

  <div class="sep"></div>

  <label class="btn" for="fileAudio">🎵 音视频</label>
  <input type="file" id="fileAudio" accept="audio/*,video/*,.mp3,.wav,.m4a,.ogg,.flac,.aac,.mp4,.webm,.mov">

  <label class="btn" for="fileLrc">📄 歌词</label>
  <input type="file" id="fileLrc" accept=".lrc,.txt,text/plain">

  <!-- 【v1.2.3】歌词整体微调：lrc 与音频差半秒是常态，让用户自己对齐 -->
  <div id="shiftBox">
    <button id="btnShiftBack" title="歌词提前 0.5 秒">◀</button>
    <span id="shiftVal">0.0s</span>
    <button id="btnShiftFwd" title="歌词延后 0.5 秒">▶</button>
  </div>

  <!-- 【v1.3.0】视频三种落点：地面 / 立屏 / 全屏背景 -->
  <div id="modeBox" title="视频放在哪儿">
    <button class="modeBtn" data-mode="floor">地面</button>
    <button class="modeBtn" data-mode="screen">立屏</button>
    <button class="modeBtn" data-mode="bg">背景</button>
  </div>

  <button id="btnDemo">看演示</button>
</div>

<div id="ver"></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
