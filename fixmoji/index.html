<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>📖 小说乱码修复</title>
<style>
  :root{
    --bg:#0b1118; --txt:#d5e3ef; --dim:#7d97ad; --acc:#4fa8e8;
    --ok:#4ade80; --warn:#fbbf24; --err:#f87171; --line:#1f2f3f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:14px 10px 50px;
    background:radial-gradient(900px 480px at 50% -8%,#12303f,transparent 62%),var(--bg);
    color:var(--txt);
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:19px;margin:0 0 3px;letter-spacing:1px;text-align:center}
  .sub{font-size:11.5px;color:var(--dim);text-align:center;margin:0 0 16px}
  .back{display:inline-block;margin-bottom:10px;color:var(--dim);font-size:12px;text-decoration:none}
  .back:hover{color:var(--acc)}

  .drop{
    border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;
    background:rgba(23,33,45,.5);transition:.18s;cursor:pointer;
  }
  .drop:hover,.drop.on{border-color:var(--acc);background:rgba(79,168,232,.08)}
  .drop .big{font-size:30px;margin-bottom:8px}
  .drop .t{font-size:13px;font-weight:600;margin-bottom:4px}
  .drop .d{font-size:11px;color:var(--dim)}

  .card{
    margin-top:14px;padding:12px;border-radius:10px;
    background:linear-gradient(180deg,rgba(23,33,45,.95),rgba(16,24,33,.95));
    border:1px solid var(--line);
  }
  .card h2{font-size:12px;margin:0 0 8px;color:var(--acc);font-weight:600}
  .row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid rgba(31,47,63,.5)}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--dim)}
  .row .v{font-weight:600}
  .v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.err{color:var(--err)}

  .preview{
    margin-top:10px;padding:10px;border-radius:8px;background:#080d13;
    border:1px solid var(--line);max-height:260px;overflow-y:auto;
    font-size:13px;line-height:1.85;white-space:pre-wrap;word-break:break-word;
  }
  .preview.bad{color:var(--err)}
  .preview.good{color:var(--txt)}

  .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  button{
    flex:1;min-width:120px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);
    background:#141d28;color:var(--txt);font-size:12.5px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:.15s;
  }
  button:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
  button.primary{background:#1b4d6b;border-color:#2a6f96;color:#cfe9f8}
  button.primary:hover:not(:disabled){background:#245d80;color:#fff}
  button:disabled{opacity:.35;cursor:default}

  .tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .tab{
    padding:5px 11px;border-radius:6px;border:1px solid var(--line);
    background:#101822;color:var(--dim);font-size:11.5px;cursor:pointer;transition:.15s;
  }
  .tab:hover{border-color:#2a6f96;color:var(--acc)}
  .tab.on{background:#1b4d6b;border-color:#2a6f96;color:#cfe9f8}

  .tip{
    margin-top:14px;padding:10px 12px;border-radius:8px;font-size:11.5px;
    background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.25);color:#e8d5a0;
  }
  .tip b{color:var(--warn)}

  #ver{position:fixed;right:8px;bottom:6px;font-size:10px;color:#37506a}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 回生活工具</a>
  <h1>📖 小说乱码修复</h1>
  <p class="sub">自动识别编码 · 全程本地 · 不上传</p>

  <div class="drop" id="drop">
    <div class="big">📄</div>
    <div class="t">点这里选文件，或把 txt 拖进来</div>
    <div class="d">支持 GBK / GB18030 / Big5 / UTF-16 / 双重乱码</div>
    <input type="file" id="file" accept=".txt,.md,.log,text/*" class="hidden">
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h2>🔍 检测结果</h2>
      <div class="row"><span class="k">文件名</span><span class="v" id="fname">—</span></div>
      <div class="row"><span class="k">大小</span><span class="v" id="fsize">—</span></div>
      <div class="row"><span class="k">BOM</span><span class="v" id="fbom">—</span></div>
      <div class="row"><span class="k">识别编码</span><span class="v" id="fenc">—</span></div>
      <div class="row"><span class="k">状态</span><span class="v" id="fstat">—</span></div>
    </div>

    <div class="card">
      <h2>📋 预览（前 500 字）</h2>
      <div class="tabs" id="tabs"></div>
      <div class="preview good" id="preview"></div>
    </div>

    <div class="btns">
      <button class="primary" id="btnSave" disabled>💾 下载 UTF-8 版</button>
      <button id="btnAgain">🔄 换个文件</button>
    </div>

    <div class="tip" id="tip" style="display:none"></div>
  </div>
</div>
<div id="ver">v1.0.0-首版 20261110</div>

<script>
(function(){
  'use strict';

  var drop = document.getElementById('drop');
  var fileInput = document.getElementById('file');
  var panel = document.getElementById('panel');
  var tabsEl = document.getElementById('tabs');
  var previewEl = document.getElementById('preview');
  var tipEl = document.getElementById('tip');
  var btnSave = document.getElementById('btnSave');
  var btnAgain = document.getElementById('btnAgain');

  var state = { text:null, name:'', candidates:[], current:null };

  // 「UTF-8 被当 GBK 读」产生的典型乱码字
  var MOJI_MARKERS = '绗涓绔犮鏂囧瓧璇寸殑浜嗘槸鍦ㄦ湁涓汉鎴戜綘浠栧ス瀹冧滑锛銆傦紝锛佹病鏈夎繖閭ｄ釜杩欐牱浠涔堟€庝箞';
  var MARKER_SET = {};
  for (var i=0;i<MOJI_MARKERS.length;i++) MARKER_SET[MOJI_MARKERS[i]] = 1;

  function scoreText(t){
    if(!t) return 0;
    var n = t.length, good = 0;
    for(var i=0;i<n;i++){
      var c = t.charCodeAt(i);
      if(c>=0x4E00 && c<=0x9FFF) good += 3;
      else if(c===0x3002||c===0xFF0C||c===0xFF01||c===0xFF1F||c===0x3001||c===0x201C||c===0x201D) good += 2;
      else if((c>=0x20&&c<=0x7E)||c===10||c===13||c===9) good += 1;
      else if(c===0xFFFD || (c>=0xE000&&c<=0xF8FF) || c<0x20) good -= 6;
      else if(c>=0xC0 && c<=0x24F) good -= 2;
    }
    return good/Math.max(n,1);
  }

  function looksDoubleMoji(t){
    if(!t || t.length<10) return false;
    var head = t.slice(0,5000), n = head.length;
    var marker=0, latin=0, bad=0;
    for(var i=0;i<n;i++){
      var ch = head[i], c = head.charCodeAt(i);
      if(MARKER_SET[ch]) marker++;
      else if(c>=0xC0 && c<=0x24F) latin++;
      else if(c===0xFFFD || (c>=0xE000&&c<=0xF8FF)) bad++;
    }
    if(bad/n > 0.05) return true;
    if((marker+latin)/n > 0.12) return true;
    return false;
  }

  // 把字符串按 latin1 编回字节（每个字符 0-255）
  function encodeLatin1(str){
    var out = new Uint8Array(str.length);
    for(var i=0;i<str.length;i++){
      var c = str.charCodeAt(i);
      if(c>255) return null;
      out[i] = c;
    }
    return out;
  }

  // 逆向：原文 UTF-8 被错当 latin1 读
  function reverseLatin1(t){
    var bytes = encodeLatin1(t);
    if(!bytes) return null;
    try{
      var fixed = new TextDecoder('utf-8',{fatal:true}).decode(bytes);
      return fixed;
    }catch(e){ return null; }
  }

  function tryDecode(buf, enc){
    try{
      return new TextDecoder(enc,{fatal:true}).decode(buf);
    }catch(e){ return null; }
  }

  function detectBOM(buf){
    var b = new Uint8Array(buf);
    if(b.length>=3 && b[0]===0xEF && b[1]===0xBB && b[2]===0xBF) return 'utf-8';
    if(b.length>=2 && b[0]===0xFF && b[1]===0xFE) return 'utf-16le';
    if(b.length>=2 && b[0]===0xFE && b[1]===0xFF) return 'utf-16be';
    return null;
  }

  var ENCODINGS = [
    {enc:'utf-8', label:'UTF-8'},
    {enc:'gb18030', label:'GB18030/GBK'},
    {enc:'gbk', label:'GBK'},
    {enc:'big5', label:'Big5 繁中'},
    {enc:'utf-16le', label:'UTF-16 LE'},
    {enc:'utf-16be', label:'UTF-16 BE'}
  ];

  function analyze(buf, name){
    var bom = detectBOM(buf);
    var results = [];

    // 1. 先尝试无损 UTF-8 读，再看是不是双重乱码
    var utf8 = tryDecode(buf, 'utf-8');
    if(utf8 !== null){
      var fixed = null, fixedScore = 0;
      if(looksDoubleMoji(utf8)){
        fixed = reverseLatin1(utf8);
        if(fixed){
          fixedScore = scoreText(fixed);
          if(fixedScore > scoreText(utf8)*1.15){
            results.push({enc:'utf-8→逆向', label:'双重乱码修复', text:fixed, score:fixedScore, best:true});
          }
        }
      }
      results.push({enc:'utf-8', label:'UTF-8', text:utf8, score:scoreText(utf8)});
    }

    // 2. 其他编码打分
    for(var i=0;i<ENCODINGS.length;i++){
      var e = ENCODINGS[i];
      if(e.enc==='utf-8') continue;
      var t = tryDecode(buf, e.enc);
      if(t===null) continue;
      var s = scoreText(t);
      var dup = false;
      for(var k=0;k<results.length;k++){
        if(results[k].text === t){ dup = true; break; }
      }
      if(dup) continue;
      results.push({enc:e.enc, label:e.label, text:t, score:s});
    }

    results.sort(function(a,b){
      if(a.best && !b.best) return -1;
      if(b.best && !a.best) return 1;
      return b.score - a.score;
    });

    return { bom:bom, results:results, name:name, size:buf.byteLength };
  }

  function fmtSize(n){
    if(n<1024) return n+' 字节';
    if(n<1048576) return (n/1024).toFixed(1)+' KB';
    return (n/1048576).toFixed(2)+' MB';
  }

  function render(res){
    document.getElementById('fname').textContent = res.name;
    document.getElementById('fsize').textContent = fmtSize(res.size);
    document.getElementById('fbom').textContent = res.bom || '无';

    var best = res.results[0];
    var encEl = document.getElementById('fenc');
    var statEl = document.getElementById('fstat');

    if(best){
      encEl.textContent = best.label + ' (' + best.enc + ')';
      encEl.className = 'v ok';
      var badChars = (best.text.match(/\uFFFD/g)||[]).length;
      if(badChars>0){
        statEl.textContent = '⚠️ 有 '+badChars+' 处字节丢失';
        statEl.className = 'v err';
        tipEl.style.display='block';
        tipEl.innerHTML = '<b>注意：</b>文件里有 '+badChars+' 个替换符（�），说明原始字节在保存时就已经丢了，<b>这部分救不回来</b>。其余内容已正常转出。';
      }else{
        statEl.textContent = '✅ 可以转换';
        statEl.className = 'v ok';
        tipEl.style.display='none';
      }
    }

    // 编码候选 tab
    tabsEl.innerHTML = '';
    res.results.forEach(function(r, idx){
      var b = document.createElement('button');
      b.className = 'tab' + (idx===0?' on':'');
      b.textContent = r.label + ' (' + r.score.toFixed(2) + ')';
      b.onclick = function(){
        var all = tabsEl.querySelectorAll('.tab');
        for(var i=0;i<all.length;i++) all[i].classList.remove('on');
        b.classList.add('on');
        showPreview(r);
      };
      tabsEl.appendChild(b);
    });

    if(best){
      state.current = best;
      showPreview(best);
      btnSave.disabled = false;
    }
  }

  function showPreview(r){
    state.current = r;
    var txt = r.text.slice(0,500);
    var bad = (txt.match(/\uFFFD/g)||[]).length;
    previewEl.textContent = txt || '(空)';
    previewEl.className = 'preview ' + (bad>0 ? 'bad' : 'good');
  }

  function handleFile(f){
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      var res = analyze(ev.target.result, f.name);
      state.name = f.name;
      state.candidates = res.results;
      panel.classList.remove('hidden');
      drop.classList.add('hidden');
      render(res);
    };
    reader.readAsArrayBuffer(f);
  }

  drop.onclick = function(){ fileInput.click(); };
  fileInput.onchange = function(e){ handleFile(e.target.files[0]); };

  // 拖拽
  ['dragenter','dragover'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('on'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('on'); });
  });
  drop.addEventListener('drop', function(e){
    if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });

  // 下载
  btnSave.onclick = function(){
    if(!state.current) return;
    var blob = new Blob([state.current.text], {type:'text/plain;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var base = state.name.replace(/\.[^.]+$/, '');
    a.href = url;
    a.download = base + '.utf8.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  };

  btnAgain.onclick = function(){
    panel.classList.add('hidden');
    drop.classList.remove('hidden');
    fileInput.value = '';
    state.text = null; state.current = null; state.candidates = [];
  };
})();
</script>
</body>
</html>
